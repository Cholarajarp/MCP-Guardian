name: CI

# Push + pull request triggers. Jobs are independent and run in parallel.
on: [push, pull_request]

# Least privilege: jobs only need to read the repo.
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint + typecheck
        run: npm run check

      - name: Build
        run: npm run build
        env:
          # next.config.js validates some env vars at build time (it throws on
          # a production build without them). These placeholders only satisfy
          # that validation in CI; real deployments set the real values
          # (NEXT_PUBLIC_API_URL=<API Gateway base URL>) in Amplify Hosting /
          # App Runner before building. The app itself reads
          # NEXT_PUBLIC_API_URL (frontend/src/lib/api.ts).
          NEXT_PUBLIC_API_URL: https://api.example.com
          NEXT_PUBLIC_CHIMERA_API_URL: https://api.example.com
          NEXT_PUBLIC_COGNITO_DOMAIN: https://placeholder.auth.us-east-1.amazoncognito.com
          NEXT_PUBLIC_COGNITO_APP_CLIENT_ID: placeholder-client-id

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        # requirements-dev.txt pulls in requirements.txt and adds pytest.
        # requirements.txt is runtime-only because it is vendored into the
        # Lambda artifact.
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q
